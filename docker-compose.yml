services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: en-trade-api
    restart: always
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - en-trade-network

  postgres:
    image: postgres:16-alpine
    container_name: en-trade-postgres
    restart: always
    env_file:
      - .env        
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - en-trade-network

volumes:
  postgres_data:

networks:
  en-trade-network:
    driver: bridge